apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate                # jamais 2 radarr en même temps sur la même base SQLite
  selector:
    matchLabels: { app: radarr }
  template:
    metadata:
      labels: { app: radarr }
    spec:
      affinity:
        nodeAffinity:
          # Obligatoire : uniquement nas1 ou nas2 (là où Longhorn a les répliques)
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [nas1, nas2] }
          # Préférence : nas2 (là où sont les films et les téléchargements)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [nas2] }
      # Bascule rapide : expulse le pod 30 s après que le nœud est déclaré injoignable (défaut 300 s)
      tolerations:
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready,   operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318   # version figée = celle qui tourne aujourd'hui
          env:
            - { name: TZ,    value: Europe/Paris }
            - { name: PUID,  value: "911" }
            - { name: PGID,  value: "100" }
            - { name: UMASK, value: "002" }
          ports:
            - { name: http, containerPort: 7878 }
          readinessProbe:
            httpGet:
              path: /ping
              port: http
              # Sinon la sonde arrive avec Host: <IP du pod>, refusée par "Allowed Hosts"
              httpHeaders: [{ name: Host, value: localhost }]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
              # Sinon la sonde arrive avec Host: <IP du pod>, refusée par "Allowed Hosts"
              httpHeaders: [{ name: Host, value: localhost }]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 1Gi }
          volumeMounts:
            - { name: config,    mountPath: /config }
            - { name: movies,    mountPath: /movies }
            - { name: downloads, mountPath: /downloads }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: radarr-config }
        # Films et téléchargements : disque local de nas2 (3 To, non répliqué).
        # Sur nas1 ces dossiers seront vides -> radarr démarre en mode dégradé
        # (il refuse de "nettoyer" un dossier racine vide, donc pas de perte en base).
        - name: movies
          hostPath: { path: /volume1/cinema/parent/movies, type: DirectoryOrCreate }
        - name: downloads
          persistentVolumeClaim: { claimName: downloads }   # Longhorn RWX partagé (nas1 + nas2)
