# smartd de nas1 (installé dans /etc/smartd.conf par disques/installer-smartd.sh)
# Même principe que smartd.nas2.conf : disques explicites, alertes Telegram, autotests à 11 h.
DEFAULT -m <nomail> -M exec /usr/local/sbin/smartd-alerte -M diminishing

# SSD Samsung 860 PRO 1 To (/volume1)
/dev/disk/by-id/ata-Samsung_SSD_860_PRO_1TB_S42NNF0K902343T -d sat -a -o on -S on -R 5! -C 197+ -U 198+ -W 4,60,70 -s (S/../.././11|L/../08/./11)
# SSD système CYX 256 Go
/dev/disk/by-id/ata-CYX-SSD-S1000_230512000201S2560415 -d sat -a -o on -S on -R 5! -C 197+ -U 198+ -W 4,60,70 -s (S/../.././11|L/../09/./11)
