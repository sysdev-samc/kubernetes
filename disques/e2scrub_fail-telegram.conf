# Installé dans /etc/systemd/system/e2scrub_fail@.service.d/telegram.conf par installer-smartd.sh
# e2scrub a trouvé des erreurs sur un système de fichiers -> Telegram (le mail n'est pas utilisé)
[Service]
ExecStart=
ExecStart=/usr/bin/env SMARTD_FAILTYPE=Fsck "SMARTD_MESSAGE=e2scrub a trouvé des ERREURS sur le système de fichiers %I : lancer e2fsck hors ligne." SMARTD_DEVICE=%I /usr/local/sbin/smartd-alerte
