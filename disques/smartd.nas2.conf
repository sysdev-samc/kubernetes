# smartd de nas2 (installé dans /etc/smartd.conf par disques/installer-smartd.sh)
# PAS de DEVICESCAN : il ignorerait toutes les lignes suivantes et surveillerait aussi les
# disques iSCSI de Longhorn. Disques désignés par by-id (les noms sdX changent).
# Alertes -> Telegram (smartd-alerte), répétées 1, 2, 4, 8... jours tant que le problème dure.
# Autotests à 11 h (alertes éventuelles en journée) : S = court (chaque jour, ~2 min),
# L = long (une fois par mois, jour différent par disque ; ~10 h pour l'IronWolf 4 To).
DEFAULT -m <nomail> -M exec /usr/local/sbin/smartd-alerte -M diminishing

# SSD système Samsung 860 PRO
/dev/disk/by-id/ata-Samsung_SSD_860_PRO_1TB_S42NNF0KA08938T -d sat -a -o on -S on -R 5! -C 197+ -U 198+ -W 4,60,70 -s (S/../.././11|L/../01/./11)
# HDD IronWolf 4 To (/volume1) : EN FIN DE VIE (08/11/2026), à remplacer
/dev/disk/by-id/ata-ST4000VN008-2DR166_ZDH9LTS6 -d sat -a -o on -S on -n standby,q -R 5! -C 197+ -U 198+ -W 4,45,55 -s (S/../.././11|L/../02/./11)
# Disque USB WD 2 To (/media/usb1) : volontairement NON surveillé (demande du 08/11/2026)
