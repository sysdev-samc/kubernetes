# smartd de nas3 (installé dans /etc/smartd.conf par disques/installer-smartd.sh)
# NVMe Crucial P2 (etcd, Longhorn) : -a surveille l'état, les erreurs média, l'usure (via
# "critical warning") et la température. Pas d'autotest planifié (non garanti sur ce modèle).
# L'eMMC système (mmcblk2) n'a pas de SMART : non surveillable par smartd.
DEFAULT -m <nomail> -M exec /usr/local/sbin/smartd-alerte -M diminishing

/dev/disk/by-id/nvme-CT250P2SSD8_2229E64B7B67 -d nvme -a -W 4,70,80
