# Pod joal : gluetun (VPN) + joal. Les 2 conteneurs partagent la même carte réseau :
# les annonces aux trackers passent TOUTES par le VPN (comme avant avec network_mode: container:gluetun).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joal
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: joal }
  template:
    metadata:
      labels: { app: joal }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [nas1, nas2] }
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [nas2] }
      tolerations:
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready,   operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      # DNS de gluetun (127.0.0.1) : les noms des trackers sont résolus via le VPN (pas de fuite DNS)
      dnsPolicy: None
      dnsConfig:
        nameservers: [127.0.0.1]
      initContainers:
        # VPN (sidecar natif) : démarre en premier, tourne toute la vie du pod.
        - name: gluetun
          image: qmcgaw/gluetun:v3.39.1
          restartPolicy: Always
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          # Fournisseur, pays et identifiants VPN : toutes les variables de
          # /ssd1/kubernetes/gluetun/vpn.env (Secret "gluetun-env", voir transmission/00-secret.sh).
          # Ne PAS les redéfinir dans "env:" ci-dessous : env est prioritaire sur envFrom.
          envFrom:
            - secretRef: { name: gluetun-env }
          env:
            - { name: FIREWALL_INPUT_PORTS, value: "12345" }     # interface web de joal
            - { name: FIREWALL_OUTBOUND_SUBNETS, value: "10.42.0.0/16,10.43.0.0/16,192.168.1.0/24" }
            - { name: HTTPPROXY, value: "off" }
            - { name: SHADOWSOCKS, value: "off" }
            - { name: TZ, value: Europe/Paris }
          startupProbe:
            exec: { command: [/gluetun-entrypoint, healthcheck] }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
          volumeMounts:
            - { name: gluetun-data, mountPath: /gluetun }
            - { name: vpn, mountPath: /gluetun/client.crt, subPath: client.crt, readOnly: true }
            - { name: vpn, mountPath: /gluetun/client.key, subPath: client.key, readOnly: true }
            - { name: tun, mountPath: /dev/net/tun }
      containers:
        - name: joal
          image: anthonyraymond/joal:2.1.37        # version figée (= "latest" du Docker, 12/2025)
          # Chemin et "secret token" de l'interface : Secret "joal" (voir 00-secret.sh), jamais dans git
          envFrom:
            - secretRef: { name: joal }
          env:
            - { name: TZ, value: Europe/Paris }
          args:
            - --joal-conf=/data
            - --spring.main.web-environment=true
            - --server.port=12345
            - --joal.ui.path.prefix=$(JOAL_UI_PREFIX)
            - --joal.ui.secret-token=$(JOAL_UI_SECRET_TOKEN)
          ports:
            - { name: http, containerPort: 12345 }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits:   { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: joal-data }
        - name: gluetun-data
          emptyDir: {}
        - name: vpn
          secret: { secretName: gluetun-certs }   # client.crt / client.key
        - name: tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
