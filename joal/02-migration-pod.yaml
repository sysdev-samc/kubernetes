# Copie /ssd1/container/joal/data (ancien Docker, disque de nas2) dans le volume Longhorn.
# Lancé par deploy.sh uniquement à la création du volume. À supprimer une fois terminé.
apiVersion: v1
kind: Pod
metadata:
  name: joal-migration
  namespace: media
spec:
  nodeName: nas2
  restartPolicy: Never
  containers:
    - name: copy
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          set -e
          cp -a /old/. /new/
          echo "copié :"; ls -la /new; ls /new/torrents /new/clients
          echo COPIE_OK
      volumeMounts:
        - { name: old, mountPath: /old, readOnly: true }
        - { name: new, mountPath: /new }
  volumes:
    - name: old
      hostPath: { path: /ssd1/container/joal/data, type: Directory }
    - name: new
      persistentVolumeClaim: { claimName: joal-data }
