# Copie /ssd1/container/speedtest-tracker/config (lecture seule) vers Longhorn.
apiVersion: v1
kind: Pod
metadata:
  name: speedtest-migration
  namespace: media
spec:
  nodeName: nas2
  restartPolicy: Never
  containers:
    - name: copy
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          set -e
          find /new -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf {} +
          cp -a /old/. /new/
          chown -R 911:100 /new
          ls -la /new
          echo COPIE_OK
      volumeMounts:
        - { name: old, mountPath: /old, readOnly: true }
        - { name: new, mountPath: /new }
  volumes:
    - name: old
      hostPath: { path: /ssd1/container/speedtest-tracker/config, type: Directory }
    - name: new
      persistentVolumeClaim: { claimName: speedtest-tracker-config }
