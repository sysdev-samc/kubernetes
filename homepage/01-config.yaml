# Configuration de Homepage (https://gethomepage.dev), montée dans /app/config.
# Les clés API ne sont PAS ici : elles viennent du Secret "homepage-env" (00-secret.sh)
# et sont référencées par {{HOMEPAGE_VAR_...}}.
# Après modification : bash /ssd1/kubernetes/homepage/deploy.sh
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: media
data:
  settings.yaml: |
    title: NAS
    language: fr
    theme: dark
    color: slate
    headerStyle: boxed
    statusStyle: dot
    layout:
      Médias:       { style: row, columns: 3 }
      Maison:       { style: row, columns: 3 }
      Réseau:       { style: row, columns: 3 }
      Sécurité:     { style: row, columns: 2 }
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system   # API Longhorn relayée par son interface

  kubernetes.yaml: |
    mode: cluster          # Homepage lit l'état des pods et des nœuds via l'API Kubernetes

  widgets.yaml: |
    - kubernetes:
        cluster: { show: true, cpu: true, memory: true, showLabel: true, label: "cluster" }
        nodes:   { show: true, cpu: true, memory: true, showLabel: true }
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: true
    - datetime:
        text_size: xl
        format: { dateStyle: full, timeStyle: short, hour12: false }

  services.yaml: |
    - Médias:
        - Seer:
            icon: overseerr.png
            href: http://192.168.1.150:5055
            description: Demandes de films et séries
            namespace: media
            podSelector: app=seer
            widget:
              type: overseerr
              url: http://seer.media:5055
              key: "{{HOMEPAGE_VAR_SEER_KEY}}"
        - Radarr:
            icon: radarr.png
            href: http://192.168.1.150:7878
            description: Films
            namespace: media
            podSelector: app=radarr
            widget:
              type: radarr
              url: http://192.168.1.150:7878     # .150 : autorisé par "Allowed Hosts" de radarr
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        - Sonarr:
            icon: sonarr.png
            href: http://192.168.1.150:8989
            description: Séries
            namespace: media
            podSelector: app=sonarr
            widget:
              type: sonarr
              url: http://192.168.1.150:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        - Transmission:
            icon: transmission.png
            href: http://192.168.1.150:9091
            description: Téléchargements (VPN)
            namespace: media
            podSelector: app=transmission
            widget:
              type: transmission
              url: http://transmission.media:9091
        - Jackett:
            icon: jackett.png
            href: http://192.168.1.150:9117
            description: Indexeurs (VPN)
            namespace: media
            podSelector: app=jackett
            widget:
              type: jackett
              url: http://jackett.media:9117
              password: "{{HOMEPAGE_VAR_JACKETT_PASSWORD}}"   # mot de passe admin de Jackett
        - PiGallery2:
            icon: pigallery2.png
            href: http://192.168.1.2:8096
            description: Galerie photos (nas2)
            siteMonitor: http://192.168.1.2:8096   # pas de widget PiGallery2 officiel : simple lien + état

    - Maison:
        - Home Assistant:
            icon: home-assistant.png
            href: http://192.168.1.2:8123
            description: Domotique
            siteMonitor: http://192.168.1.2:8123
            widget:
              type: homeassistant
              url: http://192.168.1.2:8123
              key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
        - Frigate:
            icon: frigate.png
            href: https://192.168.1.2:8971
            description: Caméras
            siteMonitor: http://192.168.1.2:5005/api/version
            widget:
              type: frigate
              url: http://192.168.1.2:5005
        - Headlamp:
            icon: headlamp.png
            href: http://192.168.1.150:4466
            description: Gestion du cluster Kubernetes
            namespace: media
            podSelector: app=headlamp

    - Réseau:
        - ntopng:
            icon: ntopng.png
            href: http://192.168.1.2:3000
            description: Trafic du réseau (Docker sur nas2)
            siteMonitor: http://192.168.1.2:3000/lua/login.lua
            widget:
              type: customapi           # pas de widget ntopng officiel : on lit son API REST
              url: http://192.168.1.2:3000/lua/rest/v2/get/interface/data.lua?ifid=0
              refreshInterval: 10000    # toutes les 10 s
              headers:
                Authorization: "Token {{HOMEPAGE_VAR_NTOPNG_TOKEN}}"
              mappings:
                - { field: { rsp: throughput_bps }, label: Débit,    format: bitrate }
                - { field: { rsp: num_devices },    label: Appareils, format: number }   # adresses MAC vues sur le LAN
                - { field: { rsp: num_flows },      label: Flux,     format: number }
                - { field: { rsp: engaged_alerts }, label: Alertes,  format: number }
        - Speedtest:
            icon: speedtest-tracker.png
            href: http://192.168.1.150:5080
            description: Débit Internet
            namespace: media
            podSelector: app=speedtest-tracker
            widget:
              type: speedtest
              url: http://speedtest-tracker.media:5080
              version: 2
              key: "{{HOMEPAGE_VAR_SPEEDTEST_KEY}}"
        - VPN d'accès (Tailscale):
            icon: tailscale.png
            description: Pour entrer dans le réseau maison depuis l'extérieur
            widget:
              type: customapi
              url: http://localhost:3000/rapports/securite-reseau.json   # produit par reseau/surveillance.py
              refreshInterval: 300000
              display: dynamic-list
              mappings:
                items: tailscale
                name: nom
                label: texte
        - IP publique:
            icon: mdi-earth
            description: Adresse de la box (hors VPN)
            widget:
              type: customapi
              url: https://ipinfo.io/json
              refreshInterval: 300000          # toutes les 5 min (limite gratuite ipinfo : 50 000/mois)
              mappings:
                - { field: ip,   label: IP }
                - { field: city, label: Ville }
                - { field: org,  label: Opérateur }
        - IP de sortie VPN (CyberGhost):
            icon: gluetun.png
            description: Sortie vers Internet des torrents (transmission, jackett)
            widget:
              type: gluetun
              url: http://transmission-vpn.media:8000   # serveur de contrôle du gluetun de transmission
              fields: ["public_ip", "region", "country"]

    - Sécurité:
        - Alertes sécurité:
            icon: mdi-shield-alert
            description: Surveillance du réseau toutes les 5 min (alertes aussi sur l'iPhone)
            widget:
              type: customapi
              url: http://localhost:3000/rapports/securite-reseau.json   # produit par reseau/surveillance.py
              refreshInterval: 300000
              display: dynamic-list
              mappings:
                items: alertes
                name: nom
                label: texte
        - Top envois:
            icon: mdi-upload-network
            description: Ce qui part vers Internet aujourd'hui (mis à jour chaque heure)
            widget:
              type: customapi
              url: http://localhost:3000/rapports/top-sortants.json   # fichier produit par reseau/top-sortants.py
              refreshInterval: 300000
              display: dynamic-list
              mappings:
                items: top
                name: nom
                label: texte
        - Top pays:
            icon: mdi-earth
            description: Échanges avec Internet aujourd'hui, par pays
            widget:
              type: customapi
              url: http://localhost:3000/rapports/securite-reseau.json   # produit par reseau/surveillance.py
              refreshInterval: 300000
              display: dynamic-list
              mappings:
                items: pays
                name: nom
                label: texte
        - Top sites:
            icon: mdi-web
            description: Serveurs les plus utilisés aujourd'hui
            widget:
              type: customapi
              url: http://localhost:3000/rapports/securite-reseau.json   # produit par reseau/surveillance.py
              refreshInterval: 300000
              display: dynamic-list
              mappings:
                items: sites
                name: nom
                label: texte

  bookmarks.yaml: |
    []
  docker.yaml: |
    {}
  custom.css: ""
  custom.js: ""
