apiVersion: apps/v1
kind: Deployment
metadata:
  name: seer
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate                # jamais 2 seer sur la même base SQLite
  selector:
    matchLabels: { app: seer }
  template:
    metadata:
      labels: { app: seer }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [nas1, nas2] }
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [nas2] }
      tolerations:
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/not-ready,   operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      containers:
        - name: seer
          image: ghcr.io/seerr-team/seerr:v3.3.0   # version figée = celle du Docker
          env:
            - { name: TZ, value: Europe/Paris }
          ports:
            - { name: http, containerPort: 5055 }
          # Même test de santé que la compose Docker
          readinessProbe:
            httpGet: { path: /api/v1/settings/public, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/v1/settings/public, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /app/config }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: seer-config }
