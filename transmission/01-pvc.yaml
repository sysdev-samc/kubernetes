# Config de transmission : 2 répliques Longhorn (nas1 + nas2)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission-config
  namespace: media
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
# /downloads n'est plus sur Longhorn : hostPath /volume1/downloads (voir phase-c-hostpath.sh).
