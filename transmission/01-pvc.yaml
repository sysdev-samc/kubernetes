# Config de transmission : 2 répliques Longhorn (nas1 + nas2)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission-config
  namespace: media
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
# /downloads PARTAGÉ entre transmission, radarr et sonarr, répliqué sur nas1 + nas2.
# ReadWriteMany : Longhorn le sert en NFS (pod "share-manager") à plusieurs pods à la fois.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads
  namespace: media
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi               # agrandissable plus tard sans coupure
